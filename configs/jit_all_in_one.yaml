# Fixed-resolution JiT All-in-One restoration

# Model
model: JiT-B/16
img_size: 256
patch_size: 256
class_num: 3
attn_dropout: 0.0
proj_dropout: 0.0

# Dataset degradation order.
# Keep this order: dataset IDs 0/1/2 generate sigma 15/25/50 noise.
de_type:
  - denoise_15
  - denoise_25
  - denoise_50
  - derain
  - dehaze
data_file_dir: ./datasets
samples_per_epoch: 6000
num_workers: 4
pin_mem: true

# JiT x-pred on a degradation-anchored ResShift bridge
prediction_type: conditional_x
bridge_type: resshift
cond_drop_prob: 0.0
lambda_flow: 1.0
lambda_l1: 1.0
resshift_steps: 15
# Pixel tensors are in [-1, 1], so use a smaller perturbation than latent ResShift.
resshift_kappa: 0.2
resshift_schedule_power: 0.3
resshift_eta_end: 0.999

# Sampling and validation
sampling_method: resshift
num_sampling_steps: 15
eval_freq: 5
num_eval_images: 4
eval_seed: 1234
diagnostic_steps: 1,4,15
diagnostic_images: 2
diagnostic_panel_size: 256

# Optimization
epochs: 100
warmup_epochs: 2
batch_size: 8
lr: 0.0001
blr: 0.00005
min_lr: 0.0
lr_schedule: cosine
weight_decay: 0.0
ema_decay: 0.9999

# Runtime and checkpoints
output_dir: ./output/jit_all_in_one
resume: ""
init_checkpoint: ""
device: cuda
seed: 0
save_last_freq: 1
log_freq: 20
evaluate_only: false
timestamp_output: true
