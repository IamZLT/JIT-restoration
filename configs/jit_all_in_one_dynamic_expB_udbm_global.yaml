# Experiment B: global UDBM bridge with u=0 (no uncertainty estimator).
# Exact official schedule when u=0:
#   beta_tau = 20 * tau * (1 - tau) + tau^2
# Time index matches UDBM: t in {0,...,T-1}, tau = t / (T-1).
# Inference is strictly one network call (one_step).

model: JiT-B/16
img_size: 512
patch_size: 512
attn_dropout: 0.0
proj_dropout: 0.0

train_sizes: "256x256,320x320,384x384,384x512,512x384,512x512"

de_type:
  - denoise_15
  - denoise_25
  - denoise_50
  - derain
  - dehaze
data_file_dir: ./datasets
samples_per_epoch: 6000
num_workers: 4
pin_mem: true

prediction_type: conditional_x
bridge_type: global_udbm_bridge
bridge_version: udbm_exact_v1
conditioning_type: state_and_degraded
lambda_flow: 1.0
lambda_l1: 1.0
lambda_ponder: 0.0001
diffusion_steps: 1000
bridge_noise_shared: 20.0
bridge_noise_terminal: 1.0

sampling_method: one_step
num_sampling_steps: 1
grad_clip: 1.0
eval_use_ema: true
eval_freq: 5
num_eval_images: 4
eval_seed: 1234
diagnostic_steps: "1"
diagnostic_images: 2
diagnostic_panel_size: 256

epochs: 200
warmup_epochs: 2
batch_size: 4
lr: 0.0001
blr: 0.00005
min_lr: 0.0
lr_schedule: cosine
weight_decay: 0.0
ema_decay: 0.9999

output_dir: ./output/jit_all_in_one_dynamic_expB_udbm_global
resume: ""
init_checkpoint: ""
device: cuda
seed: 0
world_size: 1
dist_url: env://
dist_on_itp: false
save_last_freq: 1
log_freq: 20
evaluate_only: false
timestamp_output: true
